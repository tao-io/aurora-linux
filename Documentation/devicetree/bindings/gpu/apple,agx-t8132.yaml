%YAML 1.2
---
$id: http://devicetree.org/schemas/gpu/apple,agx-t8132.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8132 G16G GPU inherited firmware resources

maintainers:
  - Sasha Finkelstein <k@chaosmail.tech>

description: |
  J713 single-GFX resource handoff. Firmware is already loaded by the boot
  chain. The bootloader publishes its actual reserved physical ranges and
  corresponding firmware virtual addresses in standard FDT byte order.
  These properties describe resources, not firmware authentication, an ABI
  version, or a grant of UAT ownership. Runtime startup must establish those
  separately. Disabled source-tree nodes have unpopulated reserved regions;
  apple,g16-handoff-version is written only after all regions are published.

properties:
  compatible:
    const: apple,agx-t8132

  reg:
    items:
      - description: GFX ASC CPU control aperture
      - description: SGX register aperture

  reg-names:
    items:
      - const: asc
      - const: sgx

  mboxes:
    maxItems: 1

  power-domains:
    maxItems: 1

  memory-region:
    items:
      - description: UAT TTBAT
      - description: Inherited shared page tables
      - description: Firmware and host UAT handoff
      - description: Inherited shared L2 page table
      - description: Loaded GFX firmware __TEXT
      - description: Loaded GFX firmware __DATA

  memory-region-names:
    items:
      - const: ttbs
      - const: pagetables
      - const: handoff
      - const: shared-l2
      - const: fw-text
      - const: fw-data

  apple,g16-handoff-version:
    $ref: /schemas/types.yaml#/definitions/uint32
    const: 1
    description: |
      Version of this resource publication contract. Present only after the
      bootloader populated all six nonoverlapping no-map reserved regions.

  apple,firmware-segment-vas:
    $ref: /schemas/types.yaml#/definitions/uint64-array
    minItems: 2
    maxItems: 2
    description: Firmware virtual addresses for fw-text and fw-data, in that order.

  apple,firmware-segment-flags:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    items:
      - const: 1
      - const: 0
    description: Inherited ADT segment flags for fw-text and fw-data.

required:
  - compatible
  - reg
  - reg-names
  - mboxes
  - power-domains
  - memory-region
  - memory-region-names

dependencies:
  apple,g16-handoff-version:
    - apple,firmware-segment-vas
    - apple,firmware-segment-flags

additionalProperties: false
